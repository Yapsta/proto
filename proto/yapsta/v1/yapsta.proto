// Yapsta's native protocol, version 1 (docs/ARCHITECTURE.md § 6).
//
// Stable API from M1 on (§ 6.7): fields, numbers, types and enum values are only
// ever added. Never renumber, retype or repurpose a field; never move a field into
// or out of a oneof; retired numbers and names are `reserved`. Every enum's 0 is
// `*_UNSPECIFIED`. Relays forward received bytes and never re-encode them.

syntax = "proto3";

package yapsta.v1;

// One frame: a u32 big-endian length, then these bytes (§ 6.1).
message Envelope {
  // 0 = none. Set on requests, on commands that want a reply, and on every frame
  // of the reply.
  uint32 request_id = 1;
  // True on the final frame of a reply.
  bool last = 2;
  oneof body {
    Error error = 3;
    Hello hello = 4;
    Auth auth = 5;
    Welcome welcome = 6;
    // Persistent, carries seq (§ 6.3).
    Event event = 7;
    // No seq (§ 6.3).
    Ephemeral ephemeral = 8;
    SetPresence set_presence = 9;
    // Empty success reply.
    Ack ack = 10;
    // Replied to with Ack; keepalive on TCP.
    Ping ping = 11;
    // M2 (minor 2).
    // Non-member to member (§ 6.2).
    Redeem redeem = 12;
    // A live session's view reset (§ 6.3).
    Snapshot resync = 13;
    // Management on the control stream (§ 6.8).
    Command command = 14;
    CommandResult command_result = 15;
    // Request streams (§ 6.8).
    Request request = 16;
    Response response = 17;
    // M3 (minor 3).
    // Typing (§ 6.9): request_id 0, never answered.
    StartTyping start_typing = 18;
  }
}

// Stable codes; each is also the connection close code (§ 6.1).
enum ErrorCode {
  // Normal close. Never sent in an Error.
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNAUTHENTICATED = 1;
  ERROR_CODE_FORBIDDEN = 2;
  ERROR_CODE_NOT_FOUND = 3;
  ERROR_CODE_RATE_LIMITED = 4;
  ERROR_CODE_INVALID = 5;
  ERROR_CODE_CONFLICT = 6;
  ERROR_CODE_TOO_LARGE = 7;
  ERROR_CODE_UNAVAILABLE = 8;
  ERROR_CODE_SLOW_CONSUMER = 9;
  ERROR_CODE_UNSUPPORTED_VERSION = 10;
  ERROR_CODE_DEVICE_NOT_LISTED = 11;
  ERROR_CODE_DEVICE_EXPIRED = 12;
  ERROR_CODE_SESSION_REPLACED = 13;
  // The account is no longer a member (§ 6.8, M2).
  ERROR_CODE_MEMBER_REMOVED = 14;
}

message Error {
  ErrorCode code = 1;
  // Fixed server text for people, at most 256 bytes; never user content, never
  // parsed by clients.
  string message = 2;
  optional uint64 retry_after_ms = 3;
  // With DEVICE_NOT_LISTED, DEVICE_EXPIRED or CONFLICT only: the stored
  // device list, sent when the list the client presented verified under its
  // account key (§ 6.2), so a seed device (restored from its phrase, or one
  // whose entry expired in a newer list) can merge it and sign the next
  // version.
  optional SignedDeviceList device_list = 4;
}

// Optional features; on only when both sides list them (§ 6.2). M1 defines none.
enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
}

// Handshake (§ 6.2).

message Hello {
  // 26 lowercase base32 characters; clients recompute it from the pinned SPKI.
  string server_id = 1;
  // Accepted minor versions, highest first (§ 6.7).
  repeated uint32 versions = 2;
  // 32 bytes from the OS RNG, fresh per connection.
  bytes challenge = 3;
  repeated Capability capabilities = 4;
  // Empty in M1; filled from M2 on.
  SpacePublicInfo space_public_info = 5;
}

// What a non-member may read (§ 6.2, M2).
message SpacePublicInfo {
  string name = 1;
  string description = 2;
  string rules = 3;
  optional uint64 icon_id = 4;
  // The space has an owner; while false only the claim code can be redeemed.
  bool claimed = 5;
}

message Auth {
  // The highest entry of Hello.versions the client speaks.
  uint32 version = 1;
  // How the client proves who it is. M7 adds a bot token beside `device`
  // (§ 6.2); a field never moves into a oneof later (§ 6.7), so the oneof is
  // here from the start.
  oneof credential {
    DeviceCredential device = 2;
  }
  repeated Capability capabilities = 3;
  ClientInfo client_info = 4;
  // The initial account status (§ 6.3).
  optional PresenceStatus presence = 5;
  optional Resume resume = 6;
}

// A person's device (§ 6.2).
message DeviceCredential {
  // 32 bytes.
  bytes account_pub = 1;
  SignedDeviceList device_list = 2;
  // 32 bytes, this instance's device key.
  bytes device_pub = 3;
  // 64 bytes: the device key's Ed25519 signature over the Auth transcript.
  bytes signature = 4;
}

message ClientInfo {
  // At most 64 bytes each; held in memory for the session only.
  string name = 1;
  string version = 2;
}

message Resume {
  // 32 opaque bytes from the previous Welcome.
  bytes token = 1;
  uint64 last_seq = 2;
}

message Welcome {
  uint64 session_id = 1;
  // Members only.
  optional uint64 account_id = 2;
  optional Member membership = 3;
  optional bytes resume_token = 4;
  // The stored device list (§ 6.2).
  optional SignedDeviceList device_list = 5;
  oneof state {
    Snapshot snapshot = 6;
    Resumed resumed = 7;
  }
}

// Device lists (§ 6.2). `body` is the encoded DeviceListBody exactly as signed;
// receivers verify the received bytes and never re-encode them.
message SignedDeviceList {
  bytes body = 1;
  bytes signature = 2;
}

message DeviceListBody {
  // A per-instance counter, at least 1.
  uint64 version = 1;
  repeated DeviceEntry devices = 2;
}

message DeviceEntry {
  // 32 bytes, this instance's device key.
  bytes device_pub = 1;
  // Unix seconds.
  uint64 expires_at = 2;
}

// Events (§ 6.3).

message Event {
  uint64 seq = 1;
  oneof kind {
    MemberJoined member_joined = 2;
    // M2 (§ 6.3).
    SpaceUpdated space_updated = 3;
    ChannelCreated channel_created = 4;
    ChannelUpdated channel_updated = 5;
    ChannelDeleted channel_deleted = 6;
    RoleCreated role_created = 7;
    RoleUpdated role_updated = 8;
    RoleDeleted role_deleted = 9;
    OverwriteSet overwrite_set = 10;
    OverwriteDeleted overwrite_deleted = 11;
    MemberUpdated member_updated = 12;
    MemberRemoved member_removed = 13;
    // M3 (§ 6.9).
    MessageCreated message_created = 14;
    MessageUpdated message_updated = 15;
    MessageDeleted message_deleted = 16;
    ReactionAdded reaction_added = 17;
    ReactionRemoved reaction_removed = 18;
    MessagePinned message_pinned = 19;
    MessageUnpinned message_unpinned = 20;
    ThreadCreated thread_created = 21;
    ThreadUpdated thread_updated = 22;
    EmojiCreated emoji_created = 23;
    EmojiUpdated emoji_updated = 24;
    EmojiDeleted emoji_deleted = 25;
  }
}

message MemberJoined {
  Member member = 1;
}

// The snapshot form leaves out bio and pronouns (§ 6.8).
message Member {
  uint64 account_id = 1;
  // Unix seconds.
  uint64 joined_at = 2;
  // M2 (§ 6.8).
  optional string nickname = 3;
  // Never lists @everyone; at most 50.
  repeated uint64 role_ids = 4;
  string display_name = 5;
  optional uint64 avatar_id = 6;
  string bio = 7;
  string pronouns = 8;
}

message Ephemeral {
  oneof kind {
    PresenceUpdate presence_update = 1;
    // M2: after channel_created, the receiver's permissions on the new
    // channel (§ 6.3).
    ChannelPermissions channel_permissions = 2;
    // M3 (§ 6.9): to the sessions that see the channel, not the sender's.
    Typing typing = 3;
    // To the target account's sessions.
    Poke poke = 4;
    // To the account's other sessions, after mark_read.
    ReadState read_state = 5;
  }
}

enum PresenceStatus {
  PRESENCE_STATUS_UNSPECIFIED = 0;
  // Only ever seen by others; invalid in SetPresence.
  PRESENCE_STATUS_OFFLINE = 1;
  PRESENCE_STATUS_ONLINE = 2;
  PRESENCE_STATUS_IDLE = 3;
  PRESENCE_STATUS_DND = 4;
  PRESENCE_STATUS_INVISIBLE = 5;
}

message PresenceUpdate {
  uint64 account_id = 1;
  PresenceStatus status = 2;
  // At most 128 bytes of UTF-8.
  string custom_status = 3;
}

message SetPresence {
  optional PresenceStatus status = 1;
  optional bool afk = 2;
  // Empty clears it.
  optional string custom_status = 3;
}

message Snapshot {
  uint64 seq = 1;
  // Your own membership.
  Member member = 2;
  // Online members.
  repeated PresenceUpdate presences = 3;
  // M2 (§ 6.3); objects in their snapshot form (§ 6.8).
  Space space = 4;
  // Visible channels only, each with its overwrites.
  repeated Channel channels = 5;
  repeated Role roles = 6;
  // Online members only.
  repeated Member members = 7;
  // § 8.2 step 1, for this account.
  fixed64 base_permissions = 8;
  // One per visible channel.
  repeated ChannelPermissions channel_permissions = 9;
  // M3 (§ 6.9): every visible text channel.
  repeated ReadState read_states = 10;
  // The space's custom emoji.
  repeated CustomEmoji emoji = 11;
}

message Resumed {
  // Current presence of online members; ephemeral events are not replayed.
  repeated PresenceUpdate presences = 1;
  // M3 (§ 6.9): read states travel as ephemerals, so they are not replayed.
  repeated ReadState read_states = 2;
}

message Ack {}

message Ping {}

// M2 (minor 2): community management (§ 6.8).
//
// Ids are uint64; positions, counts, seconds, colours and powers uint32;
// permission sets fixed64 bitfields of `Permission`; times unix seconds.
// Update commands are patches: an absent optional field stays as it is.

// Value N is bit N - 1 of a permission set (§ 8.3). Bits are stable API.
enum Permission {
  PERMISSION_UNSPECIFIED = 0;
  // General.
  PERMISSION_VIEW_CHANNEL = 1;
  PERMISSION_MANAGE_CHANNELS = 2;
  PERMISSION_MANAGE_ROLES = 3;
  PERMISSION_MANAGE_EMOJI = 4;
  PERMISSION_MANAGE_WEBHOOKS = 5;
  PERMISSION_VIEW_AUDIT_LOG = 6;
  PERMISSION_MANAGE_SPACE = 7;
  PERMISSION_CREATE_INVITES = 8;
  PERMISSION_MANAGE_INVITES = 9;
  PERMISSION_CHANGE_NICKNAME = 10;
  PERMISSION_MANAGE_NICKNAMES = 11;
  PERMISSION_KICK_MEMBERS = 12;
  PERMISSION_BAN_MEMBERS = 13;
  PERMISSION_TIMEOUT_MEMBERS = 14;
  PERMISSION_ADMINISTRATOR = 15;
  // Text.
  PERMISSION_SEND_MESSAGES = 16;
  PERMISSION_SEND_IN_THREADS = 17;
  PERMISSION_CREATE_THREADS = 18;
  PERMISSION_MANAGE_THREADS = 19;
  PERMISSION_READ_HISTORY = 20;
  PERMISSION_ATTACH_FILES = 21;
  PERMISSION_ADD_REACTIONS = 22;
  PERMISSION_USE_CUSTOM_EMOJI = 23;
  PERMISSION_MENTION_EVERYONE = 24;
  PERMISSION_MENTION_ROLES = 25;
  PERMISSION_MANAGE_MESSAGES = 26;
  PERMISSION_POKE = 27;
  PERMISSION_USE_COMMANDS = 28;
  // Voice.
  PERMISSION_CONNECT = 29;
  PERMISSION_SPEAK = 30;
  PERMISSION_VIDEO = 31;
  PERMISSION_SCREEN_SHARE = 32;
  PERMISSION_WHISPER = 33;
  PERMISSION_USE_VOICE_ACTIVITY = 34;
  PERMISSION_PRIORITY_SPEAKER = 35;
  PERMISSION_MUTE_MEMBERS = 36;
  PERMISSION_DEAFEN_MEMBERS = 37;
  PERMISSION_MOVE_MEMBERS = 38;
  PERMISSION_JOIN_FULL_CHANNEL = 39;
  PERMISSION_BYPASS_CHANNEL_PASSWORD = 40;
  PERMISSION_CREATE_TEMP_CHANNEL = 41;
}

// Objects. The snapshot form leaves out the fields marked "full form only".

message Space {
  // 0 = no owner.
  uint64 owner_account_id = 1;
  string name = 2;
  // Full form only.
  string description = 3;
  // Full form only.
  string rules = 4;
  optional uint64 icon_id = 5;
}

enum ChannelKind {
  CHANNEL_KIND_UNSPECIFIED = 0;
  CHANNEL_KIND_CATEGORY = 1;
  CHANNEL_KIND_TEXT = 2;
  CHANNEL_KIND_VOICE = 3;
}

message Channel {
  uint64 id = 1;
  ChannelKind kind = 2;
  optional uint64 parent_id = 3;
  uint32 position = 4;
  string name = 5;
  // Full form only.
  string topic = 6;
  uint32 slowmode_secs = 7;
  // 0 = no limit.
  uint32 max_members = 8;
  bool has_password = 9;
  bool age_restricted = 10;
  uint32 needed_talk_power = 11;
  // Bit/s; 0 = the codec default.
  uint32 max_bitrate = 12;
  // Only in the snapshot and get_channel.
  repeated Overwrite overwrites = 13;
  // M3 (§ 6.9), text channels: 0 = keep messages forever, else days.
  uint32 retention_days = 14;
  // Messages are kept only resume_ring_secs.
  bool no_history = 15;
}

message Role {
  uint64 id = 1;
  string name = 2;
  // 0xRRGGBB; 0 = none.
  uint32 color = 3;
  uint32 position = 4;
  bool hoist = 5;
  fixed64 permissions = 6;
  uint32 talk_power = 7;
}

message Overwrite {
  uint64 channel_id = 1;
  oneof target {
    uint64 role_id = 2;
    uint64 account_id = 3;
  }
  fixed64 allow = 4;
  fixed64 deny = 5;
}

message Invite {
  uint64 id = 1;
  uint64 created_by = 2;
  uint64 created_at = 3;
  optional uint64 expires_at = 4;
  optional uint32 max_uses = 5;
  uint32 uses = 6;
  repeated uint64 role_ids = 7;
}

message BlobData {
  uint64 blob_id = 1;
  string media_type = 2;
  bytes data = 3;
}

message ChannelPermissions {
  uint64 channel_id = 1;
  fixed64 permissions = 2;
}

// Events (§ 6.3).

message SpaceUpdated {
  Space space = 1;
}

message ChannelCreated {
  Channel channel = 1;
}

message ChannelUpdated {
  Channel channel = 1;
}

message ChannelDeleted {
  uint64 channel_id = 1;
}

message RoleCreated {
  Role role = 1;
}

message RoleUpdated {
  Role role = 1;
}

message RoleDeleted {
  uint64 role_id = 1;
}

message OverwriteSet {
  Overwrite overwrite = 1;
}

message OverwriteDeleted {
  uint64 channel_id = 1;
  oneof target {
    uint64 role_id = 2;
    uint64 account_id = 3;
  }
}

message MemberUpdated {
  Member member = 1;
}

message MemberRemoved {
  uint64 account_id = 1;
}

// A non-member's redemption (§ 6.2). Codes are secrets: never logged.
message Redeem {
  oneof code {
    string claim_code = 1;
    string invite_code = 2;
  }
}

// Commands (§ 6.8), on the control stream with request_id != 0.
message Command {
  oneof kind {
    GetSpace get_space = 1;
    UpdateSpace update_space = 2;
    SetSpaceIcon set_space_icon = 3;
    FetchSpaceIcon fetch_space_icon = 4;
    CreateChannel create_channel = 5;
    UpdateChannel update_channel = 6;
    MoveChannel move_channel = 7;
    DeleteChannel delete_channel = 8;
    SetChannelPassword set_channel_password = 9;
    GetChannel get_channel = 10;
    CreateRole create_role = 11;
    UpdateRole update_role = 12;
    MoveRole move_role = 13;
    DeleteRole delete_role = 14;
    AddMemberRole add_member_role = 15;
    RemoveMemberRole remove_member_role = 16;
    SetOverwrite set_overwrite = 17;
    DeleteOverwrite delete_overwrite = 18;
    GetMember get_member = 19;
    UpdateProfile update_profile = 20;
    SetAvatar set_avatar = 21;
    SetNickname set_nickname = 22;
    CreateInvite create_invite = 23;
    ListInvites list_invites = 24;
    RevokeInvite revoke_invite = 25;
    TransferMember transfer_member = 26;
    TransferOwnership transfer_ownership = 27;
    // M3 (§ 6.9).
    SendMessage send_message = 28;
    EditMessage edit_message = 29;
    DeleteMessage delete_message = 30;
    AddReaction add_reaction = 31;
    RemoveReaction remove_reaction = 32;
    PinMessage pin_message = 33;
    UnpinMessage unpin_message = 34;
    CreateThread create_thread = 35;
    UpdateThread update_thread = 36;
    MarkRead mark_read = 37;
    // Named PokeMember: Poke is the ephemeral the target receives.
    PokeMember poke = 38;
    CreateEmoji create_emoji = 39;
    RenameEmoji rename_emoji = 40;
    DeleteEmoji delete_emoji = 41;
  }
}

message GetSpace {}

message UpdateSpace {
  optional string name = 1;
  optional string description = 2;
  optional string rules = 3;
}

message SetSpaceIcon {
  // Absent clears it.
  optional uint64 blob_id = 1;
}

message FetchSpaceIcon {}

message CreateChannel {
  ChannelKind kind = 1;
  optional uint64 parent_id = 2;
  optional uint32 position = 3;
  string name = 4;
  optional string topic = 5;
  optional uint32 slowmode_secs = 6;
  optional uint32 max_members = 7;
  optional bool age_restricted = 8;
  optional uint32 needed_talk_power = 9;
  optional uint32 max_bitrate = 10;
  // M3 (§ 6.9), text channels.
  optional uint32 retention_days = 11;
  optional bool no_history = 12;
}

message UpdateChannel {
  uint64 channel_id = 1;
  optional string name = 2;
  optional string topic = 3;
  optional uint32 slowmode_secs = 4;
  optional uint32 max_members = 5;
  optional bool age_restricted = 6;
  optional uint32 needed_talk_power = 7;
  optional uint32 max_bitrate = 8;
  // M3 (§ 6.9), text channels.
  optional uint32 retention_days = 9;
  optional bool no_history = 10;
}

message MoveChannel {
  uint64 channel_id = 1;
  // Absent = top level.
  optional uint64 parent_id = 2;
  uint32 position = 3;
}

message DeleteChannel {
  uint64 channel_id = 1;
}

message SetChannelPassword {
  uint64 channel_id = 1;
  // A secret. Absent clears it.
  optional string password = 2;
}

message GetChannel {
  uint64 channel_id = 1;
}

message CreateRole {
  string name = 1;
  optional uint32 color = 2;
  optional bool hoist = 3;
  optional fixed64 permissions = 4;
  optional uint32 talk_power = 5;
}

message UpdateRole {
  uint64 role_id = 1;
  optional string name = 2;
  optional uint32 color = 3;
  optional bool hoist = 4;
  optional fixed64 permissions = 5;
  optional uint32 talk_power = 6;
}

message MoveRole {
  uint64 role_id = 1;
  uint32 position = 2;
}

message DeleteRole {
  uint64 role_id = 1;
}

message AddMemberRole {
  uint64 account_id = 1;
  uint64 role_id = 2;
}

message RemoveMemberRole {
  uint64 account_id = 1;
  uint64 role_id = 2;
}

message SetOverwrite {
  Overwrite overwrite = 1;
}

message DeleteOverwrite {
  uint64 channel_id = 1;
  oneof target {
    uint64 role_id = 2;
    uint64 account_id = 3;
  }
}

message GetMember {
  uint64 account_id = 1;
}

message UpdateProfile {
  optional string display_name = 1;
  optional string bio = 2;
  optional string pronouns = 3;
}

message SetAvatar {
  // Absent clears it.
  optional uint64 blob_id = 1;
}

message SetNickname {
  uint64 account_id = 1;
  // Absent clears it.
  optional string nickname = 2;
}

message CreateInvite {
  // Absent = never expires.
  optional uint32 expires_in_secs = 1;
  optional uint32 max_uses = 2;
  repeated uint64 role_ids = 3;
}

message ListInvites {}

message RevokeInvite {
  uint64 invite_id = 1;
}

message TransferMember {
  uint64 from_account_id = 1;
  uint64 to_account_id = 2;
}

message TransferOwnership {
  uint64 to_account_id = 1;
}

message CommandResult {
  oneof kind {
    Space space = 1;
    Channel channel = 2;
    uint64 created_id = 3;
    Member member = 4;
    InviteCreated invite_created = 5;
    InviteList invites = 6;
    BlobData blob = 7;
  }
}

message InviteCreated {
  Invite invite = 1;
  // A secret, returned once.
  string code = 2;
}

message InviteList {
  repeated Invite invites = 1;
}

// Requests (§ 6.8), on a QUIC request stream or multiplexed on TCP.
message Request {
  oneof kind {
    MemberPageRequest member_page = 1;
    FetchBlobRequest fetch_blob = 2;
    UploadImageRequest upload_image = 3;
    // M3 (§ 6.9).
    MessageHistoryRequest message_history = 4;
    GetMessagesRequest get_messages = 5;
    ListPinsRequest list_pins = 6;
    ListThreadsRequest list_threads = 7;
    SearchRequest search = 8;
    UploadAttachmentRequest upload_attachment = 9;
    FetchAttachmentRequest fetch_attachment = 10;
    AttachmentUrlRequest attachment_url = 11;
    UploadUrlRequest upload_url = 12;
  }
}

message MemberPageRequest {
  optional uint64 after_account_id = 1;
  // 1 to 1,000.
  uint32 limit = 2;
}

message FetchBlobRequest {
  uint64 blob_id = 1;
}

message UploadImageRequest {
  bytes data = 1;
  // M3 (§ 6.5, § 6.9). UNSPECIFIED means AVATAR.
  ImagePurpose purpose = 2;
}

enum ImagePurpose {
  IMAGE_PURPOSE_UNSPECIFIED = 0;
  // Re-encoded to at most 512 x 512 px: avatars and the space icon.
  IMAGE_PURPOSE_AVATAR = 1;
  // Re-encoded to at most 128 x 128 px: custom emoji.
  IMAGE_PURPOSE_EMOJI = 2;
}

message Response {
  oneof kind {
    MemberPage member_page = 1;
    BlobData blob = 2;
    Uploaded uploaded = 3;
    // M3 (§ 6.9).
    MessageList messages = 4;
    ThreadList threads = 5;
    SignedUrl url = 6;
    UploadSlot upload_slot = 7;
  }
}

message MemberPage {
  // Snapshot form, by ascending account_id, online and offline.
  repeated Member members = 1;
  bool has_more = 2;
  // The online ones' presence.
  repeated PresenceUpdate presences = 3;
}

message Uploaded {
  uint64 blob_id = 1;
}

// M3 (minor 3): text chat (§ 6.9). Ids uint64, times unix seconds; message ids
// increase in commit order. User text here is data, never markup, and never
// logged (§ 7.6).

// Objects.

message Message {
  uint64 id = 1;
  uint64 channel_id = 2;
  // Set on a thread's messages: the thread's (root message's) id.
  optional uint64 thread_id = 3;
  // 0 = a deleted member (§ 7.3).
  uint64 author_id = 4;
  uint64 created_at = 5;
  // Empty on a tombstone.
  string content = 6;
  optional uint64 reply_to = 7;
  // Parsed by the server from content; never sent by clients.
  Mentions mentions = 8;
  repeated Attachment attachments = 9;
  repeated ReactionCount reactions = 10;
  optional uint64 edited_at = 11;
  // A tombstone: no content, mentions, attachments or reactions.
  bool deleted = 12;
  bool pinned = 13;
}

message Mentions {
  repeated uint64 account_ids = 1;
  repeated uint64 role_ids = 2;
  repeated uint64 channel_ids = 3;
  bool everyone = 4;
  bool here = 5;
}

// No file name, ever (§ 6.5).
message Attachment {
  uint64 id = 1;
  // Sniffed by the server from the file's first bytes.
  string media_type = 2;
  uint64 size = 3;
  // 0 when not an image.
  uint32 width = 4;
  uint32 height = 5;
  bool has_thumbnail = 6;
}

message EmojiRef {
  oneof emoji {
    string unicode = 1;
    uint64 custom_id = 2;
  }
}

message ReactionCount {
  EmojiRef emoji = 1;
  uint32 count = 2;
  // Whether the requester reacted: set in Responses only, false in events.
  bool me = 3;
}

// Thread.id is its root message's id.
message Thread {
  uint64 id = 1;
  uint64 channel_id = 2;
  string name = 3;
  bool archived = 4;
  uint64 created_by = 5;
  uint64 created_at = 6;
}

message CustomEmoji {
  uint64 id = 1;
  string name = 2;
  // An attachment id, fetched with fetch_blob.
  uint64 image_id = 3;
  uint64 created_by = 4;
}

// Covers a channel together with its threads.
message ReadState {
  uint64 channel_id = 1;
  // 0 = nothing read.
  uint64 last_read_id = 2;
  uint32 mention_count = 3;
  // 0 = no message.
  uint64 last_message_id = 4;
}

// Commands.

message SendMessage {
  uint64 channel_id = 1;
  optional uint64 thread_id = 2;
  string content = 3;
  optional uint64 reply_to = 4;
  // The sender's own pending attachments, at most 10.
  repeated uint64 attachment_ids = 5;
}

message EditMessage {
  uint64 message_id = 1;
  string content = 2;
}

message DeleteMessage {
  uint64 message_id = 1;
}

message AddReaction {
  uint64 message_id = 1;
  EmojiRef emoji = 2;
}

message RemoveReaction {
  uint64 message_id = 1;
  EmojiRef emoji = 2;
  // Absent = the actor's own; another's needs MANAGE_MESSAGES.
  optional uint64 account_id = 3;
}

message PinMessage {
  uint64 message_id = 1;
}

message UnpinMessage {
  uint64 message_id = 1;
}

message CreateThread {
  uint64 message_id = 1;
  string name = 2;
}

message UpdateThread {
  uint64 thread_id = 1;
  optional string name = 2;
  optional bool archived = 3;
}

message MarkRead {
  uint64 channel_id = 1;
  // A message of the channel or its threads; 0 = nothing read.
  uint64 message_id = 2;
}

message PokeMember {
  uint64 account_id = 1;
  optional string text = 2;
}

message CreateEmoji {
  string name = 1;
  // The actor's pending upload_image with purpose EMOJI.
  uint64 image_id = 2;
}

message RenameEmoji {
  uint64 emoji_id = 1;
  string name = 2;
}

message DeleteEmoji {
  uint64 emoji_id = 1;
}

// Requests.

message MessageHistoryRequest {
  uint64 channel_id = 1;
  optional uint64 thread_id = 2;
  // Absent = the newest messages.
  oneof anchor {
    uint64 before = 3;
    uint64 after = 4;
    uint64 around = 5;
  }
  // 1 to 100.
  uint32 limit = 6;
}

message GetMessagesRequest {
  // 1 to 100.
  repeated uint64 message_ids = 1;
}

message ListPinsRequest {
  uint64 channel_id = 1;
}

message ListThreadsRequest {
  uint64 channel_id = 1;
  bool archived = 2;
  optional uint64 before_id = 3;
  // 1 to 100.
  uint32 limit = 4;
}

message SearchRequest {
  string query = 1;
  optional uint64 before_id = 2;
  // 1 to 25.
  uint32 limit = 3;
}

message UploadAttachmentRequest {
  bytes data = 1;
}

message FetchAttachmentRequest {
  uint64 attachment_id = 1;
  bool thumbnail = 2;
}

message AttachmentUrlRequest {
  uint64 attachment_id = 1;
  bool thumbnail = 2;
}

message UploadUrlRequest {
  uint64 size = 1;
}

// Responses.

message MessageList {
  repeated Message messages = 1;
  bool has_more = 2;
}

message ThreadList {
  repeated Thread threads = 1;
  bool has_more = 2;
}

// A secret until it expires: never logged.
message SignedUrl {
  string url = 1;
  uint64 expires_at = 2;
}

message UploadSlot {
  uint64 attachment_id = 1;
  // A secret until it expires: never logged.
  string url = 2;
  uint64 expires_at = 3;
}

// Typing.

message StartTyping {
  uint64 channel_id = 1;
  optional uint64 thread_id = 2;
}

// Events.

message MessageCreated {
  Message message = 1;
}

// An edit; the message's full form.
message MessageUpdated {
  Message message = 1;
}

message MessageDeleted {
  uint64 channel_id = 1;
  uint64 message_id = 2;
}

message ReactionAdded {
  uint64 channel_id = 1;
  uint64 message_id = 2;
  EmojiRef emoji = 3;
  uint64 account_id = 4;
}

message ReactionRemoved {
  uint64 channel_id = 1;
  uint64 message_id = 2;
  EmojiRef emoji = 3;
  uint64 account_id = 4;
}

message MessagePinned {
  uint64 channel_id = 1;
  uint64 message_id = 2;
  uint64 pinned_by = 3;
}

message MessageUnpinned {
  uint64 channel_id = 1;
  uint64 message_id = 2;
}

message ThreadCreated {
  Thread thread = 1;
}

message ThreadUpdated {
  Thread thread = 1;
}

message EmojiCreated {
  CustomEmoji emoji = 1;
}

message EmojiUpdated {
  CustomEmoji emoji = 1;
}

message EmojiDeleted {
  uint64 emoji_id = 1;
}

// Ephemerals.

message Typing {
  uint64 channel_id = 1;
  optional uint64 thread_id = 2;
  uint64 account_id = 3;
}

message Poke {
  uint64 from_account_id = 1;
  string text = 2;
}
