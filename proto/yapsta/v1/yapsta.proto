// Yapsta's native protocol, version 1 (docs/ARCHITECTURE.md § 6).
//
// Stable API from M1 on (§ 6.7): fields, numbers, types and enum values are only
// ever added. Never renumber, retype or repurpose a field; never move a field into
// or out of a oneof; retired numbers and names are `reserved`. Every enum's 0 is
// `*_UNSPECIFIED`. Relays forward received bytes and never re-encode them.

syntax = "proto3";

package yapsta.v1;

// One frame: a u32 big-endian length, then these bytes (§ 6.1).
message Envelope {
  // 0 = none. Set on requests, on commands that want a reply, and on every frame
  // of the reply.
  uint32 request_id = 1;
  // True on the final frame of a reply.
  bool last = 2;
  oneof body {
    Error error = 3;
    Hello hello = 4;
    Auth auth = 5;
    Welcome welcome = 6;
    // Persistent, carries seq (§ 6.3).
    Event event = 7;
    // No seq (§ 6.3).
    Ephemeral ephemeral = 8;
    SetPresence set_presence = 9;
    // Empty success reply.
    Ack ack = 10;
    // Replied to with Ack; keepalive on TCP.
    Ping ping = 11;
    // M2 (minor 2).
    // Non-member to member (§ 6.2).
    Redeem redeem = 12;
    // A live session's view reset (§ 6.3).
    Snapshot resync = 13;
    // Management on the control stream (§ 6.8).
    Command command = 14;
    CommandResult command_result = 15;
    // Request streams (§ 6.8).
    Request request = 16;
    Response response = 17;
    // M3 (minor 3).
    // Typing (§ 6.9): request_id 0, never answered.
    StartTyping start_typing = 18;
  }
}

// Stable codes; each is also the connection close code (§ 6.1).
enum ErrorCode {
  // Normal close. Never sent in an Error.
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNAUTHENTICATED = 1;
  ERROR_CODE_FORBIDDEN = 2;
  ERROR_CODE_NOT_FOUND = 3;
  ERROR_CODE_RATE_LIMITED = 4;
  ERROR_CODE_INVALID = 5;
  ERROR_CODE_CONFLICT = 6;
  ERROR_CODE_TOO_LARGE = 7;
  ERROR_CODE_UNAVAILABLE = 8;
  ERROR_CODE_SLOW_CONSUMER = 9;
  ERROR_CODE_UNSUPPORTED_VERSION = 10;
  ERROR_CODE_DEVICE_NOT_LISTED = 11;
  ERROR_CODE_DEVICE_EXPIRED = 12;
  ERROR_CODE_SESSION_REPLACED = 13;
  // The account is no longer a member (§ 6.8, M2).
  ERROR_CODE_MEMBER_REMOVED = 14;
}

message Error {
  ErrorCode code = 1;
  // Fixed server text for people, at most 256 bytes; never user content, never
  // parsed by clients.
  string message = 2;
  optional uint64 retry_after_ms = 3;
  // With DEVICE_NOT_LISTED, DEVICE_EXPIRED or CONFLICT only: the stored
  // device list, sent when the list the client presented verified under its
  // account key (§ 6.2), so a seed device (restored from its phrase, or one
  // whose entry expired in a newer list) can merge it and sign the next
  // version.
  optional SignedDeviceList device_list = 4;
}

// Optional features; on only when both sides list them (§ 6.2). M1 defines none.
enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
}

// Handshake (§ 6.2).

message Hello {
  // 26 lowercase base32 characters; clients recompute it from the pinned SPKI.
  string server_id = 1;
  // Accepted minor versions, highest first (§ 6.7).
  repeated uint32 versions = 2;
  // 32 bytes from the OS RNG, fresh per connection.
  bytes challenge = 3;
  repeated Capability capabilities = 4;
  // Empty in M1; filled from M2 on.
  SpacePublicInfo space_public_info = 5;
}

// What a non-member may read (§ 6.2, M2).
message SpacePublicInfo {
  string name = 1;
  string description = 2;
  string rules = 3;
  optional uint64 icon_id = 4;
  // The space has an owner; while false only the claim code can be redeemed.
  bool claimed = 5;
  // M5 (§ 6.11): the style only; the switches are for members.
  SpaceStyle style = 6;
  // M7 (§ 6.14): whether a non-member may join without an invite.
  JoinPolicy join_policy = 7;
}

message Auth {
  // The highest entry of Hello.versions the client speaks.
  uint32 version = 1;
  // How the client proves who it is: a person's device, or from M8 a bot
  // (§ 6.15); a field never moves into a oneof later (§ 6.7), so the oneof
  // was here from the start.
  oneof credential {
    DeviceCredential device = 2;
    // M8 (§ 6.15): needs `version` 8 or later.
    BotCredential bot = 7;
  }
  repeated Capability capabilities = 3;
  ClientInfo client_info = 4;
  // The initial account status (§ 6.3).
  optional PresenceStatus presence = 5;
  optional Resume resume = 6;
}

// A bot (§ 6.15, M8): its key, derived from the seed shown at creation, and
// its Ed25519 signature over the bot Auth transcript (§ 6.2).
message BotCredential {
  // 32 bytes.
  bytes bot_pub = 1;
  // 64 bytes.
  bytes signature = 2;
}

// A person's device (§ 6.2).
message DeviceCredential {
  // 32 bytes.
  bytes account_pub = 1;
  SignedDeviceList device_list = 2;
  // 32 bytes, this instance's device key.
  bytes device_pub = 3;
  // 64 bytes: the device key's Ed25519 signature over the Auth transcript.
  bytes signature = 4;
}

message ClientInfo {
  // At most 64 bytes each; held in memory for the session only.
  string name = 1;
  string version = 2;
}

message Resume {
  // 32 opaque bytes from the previous Welcome.
  bytes token = 1;
  uint64 last_seq = 2;
}

message Welcome {
  uint64 session_id = 1;
  // Members only.
  optional uint64 account_id = 2;
  optional Member membership = 3;
  optional bytes resume_token = 4;
  // The stored device list (§ 6.2).
  optional SignedDeviceList device_list = 5;
  oneof state {
    Snapshot snapshot = 6;
    Resumed resumed = 7;
  }
}

// Device lists (§ 6.2). `body` is the encoded DeviceListBody exactly as signed;
// receivers verify the received bytes and never re-encode them.
message SignedDeviceList {
  bytes body = 1;
  bytes signature = 2;
}

message DeviceListBody {
  // A per-instance counter, at least 1.
  uint64 version = 1;
  repeated DeviceEntry devices = 2;
}

message DeviceEntry {
  // 32 bytes, this instance's device key.
  bytes device_pub = 1;
  // Unix seconds.
  uint64 expires_at = 2;
}

// Events (§ 6.3).

message Event {
  uint64 seq = 1;
  oneof kind {
    MemberJoined member_joined = 2;
    // M2 (§ 6.3).
    SpaceUpdated space_updated = 3;
    ChannelCreated channel_created = 4;
    ChannelUpdated channel_updated = 5;
    ChannelDeleted channel_deleted = 6;
    RoleCreated role_created = 7;
    RoleUpdated role_updated = 8;
    RoleDeleted role_deleted = 9;
    OverwriteSet overwrite_set = 10;
    OverwriteDeleted overwrite_deleted = 11;
    MemberUpdated member_updated = 12;
    MemberRemoved member_removed = 13;
    // M3 (§ 6.9).
    MessageCreated message_created = 14;
    MessageUpdated message_updated = 15;
    MessageDeleted message_deleted = 16;
    ReactionAdded reaction_added = 17;
    ReactionRemoved reaction_removed = 18;
    MessagePinned message_pinned = 19;
    MessageUnpinned message_unpinned = 20;
    ThreadCreated thread_created = 21;
    ThreadUpdated thread_updated = 22;
    EmojiCreated emoji_created = 23;
    EmojiUpdated emoji_updated = 24;
    EmojiDeleted emoji_deleted = 25;
    // M4 (§ 6.10).
    VoiceStateUpdated voice_state_updated = 26;
    // M7 (§ 6.6): to every session that can see the track's channel. Minor 7
    // only.
    MediaTrackAdded media_track_added = 27;
    MediaTrackRemoved media_track_removed = 28;
    // M8 (§ 6.15): to every member, after a bot's register_commands. Minor 8
    // only.
    CommandsUpdated commands_updated = 29;
    // M9 (§ 6.16): to the sessions that see the channel, after delete_thread.
    // Minor 9 only.
    ThreadDeleted thread_deleted = 30;
  }
}

message MemberJoined {
  Member member = 1;
}

// The snapshot form leaves out bio and pronouns (§ 6.8).
message Member {
  uint64 account_id = 1;
  // Unix seconds.
  uint64 joined_at = 2;
  // M2 (§ 6.8).
  optional string nickname = 3;
  // Never lists @everyone; at most 50.
  repeated uint64 role_ids = 4;
  string display_name = 5;
  optional uint64 avatar_id = 6;
  string bio = 7;
  string pronouns = 8;
  // M6 (§ 6.12), in both forms: present while the timeout is in the future
  // when the message is built. Clients compare it with their clock.
  optional uint64 timeout_until = 9;
  // M8 (§ 6.15), in both forms: the account is a bot.
  bool bot = 10;
}

message Ephemeral {
  oneof kind {
    PresenceUpdate presence_update = 1;
    // M2: after channel_created, the receiver's permissions on the new
    // channel (§ 6.3).
    ChannelPermissions channel_permissions = 2;
    // M3 (§ 6.9): to the sessions that see the channel, not the sender's.
    Typing typing = 3;
    // To the target account's sessions.
    Poke poke = 4;
    // To the account's other sessions, after mark_read.
    ReadState read_state = 5;
    // M4 (§ 6.10): to one session, whenever its own voice membership
    // changes.
    VoiceSession voice_session = 6;
    // M7 (§ 6.6): to the owning session when the server ends its track or
    // subscription. Minor 7 only.
    MediaEnded media_ended = 7;
    // M8 (§ 6.15): to the bot's session when a member invokes one of its
    // commands. Minor 8 only.
    Interaction interaction = 8;
  }
}

enum PresenceStatus {
  PRESENCE_STATUS_UNSPECIFIED = 0;
  // Only ever seen by others; invalid in SetPresence.
  PRESENCE_STATUS_OFFLINE = 1;
  PRESENCE_STATUS_ONLINE = 2;
  PRESENCE_STATUS_IDLE = 3;
  PRESENCE_STATUS_DND = 4;
  PRESENCE_STATUS_INVISIBLE = 5;
}

message PresenceUpdate {
  uint64 account_id = 1;
  PresenceStatus status = 2;
  // At most 128 bytes of UTF-8.
  string custom_status = 3;
}

message SetPresence {
  optional PresenceStatus status = 1;
  optional bool afk = 2;
  // Empty clears it.
  optional string custom_status = 3;
}

message Snapshot {
  uint64 seq = 1;
  // Your own membership.
  Member member = 2;
  // Online members.
  repeated PresenceUpdate presences = 3;
  // M2 (§ 6.3); objects in their snapshot form (§ 6.8).
  Space space = 4;
  // Visible channels only, each with its overwrites.
  repeated Channel channels = 5;
  repeated Role roles = 6;
  // Online members only.
  repeated Member members = 7;
  // § 8.2 step 1, for this account.
  fixed64 base_permissions = 8;
  // One per visible channel.
  repeated ChannelPermissions channel_permissions = 9;
  // M3 (§ 6.9): every visible text channel.
  repeated ReadState read_states = 10;
  // The space's custom emoji.
  repeated CustomEmoji emoji = 11;
  // M4 (§ 6.10): the states in voice channels this session can see.
  repeated VoiceState voice_states = 12;
  // M7 (§ 6.6): the live tracks in channels this session can see. Minor 7
  // only.
  repeated MediaTrack media_tracks = 13;
}

message Resumed {
  // Current presence of online members; ephemeral events are not replayed.
  repeated PresenceUpdate presences = 1;
  // M3 (§ 6.9): read states travel as ephemerals, so they are not replayed.
  repeated ReadState read_states = 2;
}

message Ack {}

message Ping {}

// M2 (minor 2): community management (§ 6.8).
//
// Ids are uint64; positions, counts, seconds, colours and powers uint32;
// permission sets fixed64 bitfields of `Permission`; times unix seconds.
// Update commands are patches: an absent optional field stays as it is.

// Value N is bit N - 1 of a permission set (§ 8.3). Bits are stable API.
enum Permission {
  PERMISSION_UNSPECIFIED = 0;
  // General.
  PERMISSION_VIEW_CHANNEL = 1;
  PERMISSION_MANAGE_CHANNELS = 2;
  PERMISSION_MANAGE_ROLES = 3;
  PERMISSION_MANAGE_EMOJI = 4;
  PERMISSION_MANAGE_WEBHOOKS = 5;
  PERMISSION_VIEW_AUDIT_LOG = 6;
  PERMISSION_MANAGE_SPACE = 7;
  PERMISSION_CREATE_INVITES = 8;
  PERMISSION_MANAGE_INVITES = 9;
  PERMISSION_CHANGE_NICKNAME = 10;
  PERMISSION_MANAGE_NICKNAMES = 11;
  PERMISSION_KICK_MEMBERS = 12;
  PERMISSION_BAN_MEMBERS = 13;
  PERMISSION_TIMEOUT_MEMBERS = 14;
  PERMISSION_ADMINISTRATOR = 15;
  // Text.
  PERMISSION_SEND_MESSAGES = 16;
  PERMISSION_SEND_IN_THREADS = 17;
  PERMISSION_CREATE_THREADS = 18;
  PERMISSION_MANAGE_THREADS = 19;
  PERMISSION_READ_HISTORY = 20;
  PERMISSION_ATTACH_FILES = 21;
  PERMISSION_ADD_REACTIONS = 22;
  PERMISSION_USE_CUSTOM_EMOJI = 23;
  PERMISSION_MENTION_EVERYONE = 24;
  PERMISSION_MENTION_ROLES = 25;
  PERMISSION_MANAGE_MESSAGES = 26;
  PERMISSION_POKE = 27;
  PERMISSION_USE_COMMANDS = 28;
  // Voice.
  PERMISSION_CONNECT = 29;
  PERMISSION_SPEAK = 30;
  PERMISSION_VIDEO = 31;
  PERMISSION_SCREEN_SHARE = 32;
  PERMISSION_WHISPER = 33;
  PERMISSION_USE_VOICE_ACTIVITY = 34;
  PERMISSION_PRIORITY_SPEAKER = 35;
  PERMISSION_MUTE_MEMBERS = 36;
  PERMISSION_DEAFEN_MEMBERS = 37;
  PERMISSION_MOVE_MEMBERS = 38;
  PERMISSION_JOIN_FULL_CHANNEL = 39;
  PERMISSION_BYPASS_CHANNEL_PASSWORD = 40;
  PERMISSION_CREATE_TEMP_CHANNEL = 41;
}

// Objects. The snapshot form leaves out the fields marked "full form only".

message Space {
  // 0 = no owner.
  uint64 owner_account_id = 1;
  string name = 2;
  // Full form only.
  string description = 3;
  // Full form only.
  string rules = 4;
  optional uint64 icon_id = 5;
  // M5 (§ 6.11), in both forms. Never UNSPECIFIED from a server.
  SpaceStyle style = 6;
  bool lobby_on_connect = 7;
  bool threads = 8;
  bool reactions = 9;
  // Presentation only: whether clients show a member panel.
  bool member_list = 10;
  VoiceChatAccess voice_chat_access = 11;
  // Formed per recipient: absent without VIEW_CHANNEL on it.
  optional uint64 default_voice_channel = 12;
  // M7 (§ 6.14): INVITE_ONLY or OPEN, and the roles an open join gives
  // (ascending, never @everyone).
  JoinPolicy join_policy = 13;
  repeated uint64 open_join_role_ids = 14;
}

// M5 (§ 6.11): how a space is run; clients lay themselves out by it.
enum SpaceStyle {
  SPACE_STYLE_UNSPECIFIED = 0;
  SPACE_STYLE_VOICE_FIRST = 1;
  SPACE_STYLE_TEXT_FIRST = 2;
}

// M7 (§ 6.14). The server sends INVITE_ONLY or OPEN, never UNSPECIFIED; a
// client treats UNSPECIFIED or an unknown value as INVITE_ONLY.
enum JoinPolicy {
  JOIN_POLICY_UNSPECIFIED = 0;
  JOIN_POLICY_INVITE_ONLY = 1;
  JOIN_POLICY_OPEN = 2;
}

// M5 (§ 6.11): who reads a voice channel's chat.
enum VoiceChatAccess {
  VOICE_CHAT_ACCESS_UNSPECIFIED = 0;
  VOICE_CHAT_ACCESS_MEMBERS_IN_CHANNEL = 1;
  VOICE_CHAT_ACCESS_CHANNEL_VIEWERS = 2;
}

// M5 (§ 6.11): the starter templates `apply_template` adds.
enum StarterTemplate {
  STARTER_TEMPLATE_UNSPECIFIED = 0;
  STARTER_TEMPLATE_GAMING = 1;
  STARTER_TEMPLATE_COMMUNITY = 2;
  STARTER_TEMPLATE_SMALL_TEAM = 3;
}

enum ChannelKind {
  CHANNEL_KIND_UNSPECIFIED = 0;
  CHANNEL_KIND_CATEGORY = 1;
  CHANNEL_KIND_TEXT = 2;
  CHANNEL_KIND_VOICE = 3;
}

message Channel {
  uint64 id = 1;
  ChannelKind kind = 2;
  optional uint64 parent_id = 3;
  uint32 position = 4;
  string name = 5;
  // Full form only.
  string topic = 6;
  uint32 slowmode_secs = 7;
  // 0 = no limit.
  uint32 max_members = 8;
  bool has_password = 9;
  bool age_restricted = 10;
  uint32 needed_talk_power = 11;
  // Bit/s; 0 = the codec default.
  uint32 max_bitrate = 12;
  // Only in the snapshot and get_channel.
  repeated Overwrite overwrites = 13;
  // M3 (§ 6.9), text channels: 0 = keep messages forever, else days.
  uint32 retention_days = 14;
  // Messages are kept only resume_ring_secs.
  bool no_history = 15;
  // M4 (§ 6.10), voice channels: deleted once empty for 60 s.
  bool temporary = 16;
}

message Role {
  uint64 id = 1;
  string name = 2;
  // 0xRRGGBB; 0 = none.
  uint32 color = 3;
  uint32 position = 4;
  bool hoist = 5;
  fixed64 permissions = 6;
  uint32 talk_power = 7;
}

message Overwrite {
  uint64 channel_id = 1;
  oneof target {
    uint64 role_id = 2;
    uint64 account_id = 3;
  }
  fixed64 allow = 4;
  fixed64 deny = 5;
}

message Invite {
  uint64 id = 1;
  uint64 created_by = 2;
  uint64 created_at = 3;
  optional uint64 expires_at = 4;
  optional uint32 max_uses = 5;
  uint32 uses = 6;
  repeated uint64 role_ids = 7;
}

message BlobData {
  uint64 blob_id = 1;
  string media_type = 2;
  bytes data = 3;
}

message ChannelPermissions {
  uint64 channel_id = 1;
  fixed64 permissions = 2;
}

// Events (§ 6.3).

message SpaceUpdated {
  Space space = 1;
}

message ChannelCreated {
  Channel channel = 1;
}

message ChannelUpdated {
  Channel channel = 1;
}

message ChannelDeleted {
  uint64 channel_id = 1;
}

message RoleCreated {
  Role role = 1;
}

message RoleUpdated {
  Role role = 1;
}

message RoleDeleted {
  uint64 role_id = 1;
}

message OverwriteSet {
  Overwrite overwrite = 1;
}

message OverwriteDeleted {
  uint64 channel_id = 1;
  oneof target {
    uint64 role_id = 2;
    uint64 account_id = 3;
  }
}

message MemberUpdated {
  Member member = 1;
}

message MemberRemoved {
  uint64 account_id = 1;
  // M6 (§ 6.12). Never UNSPECIFIED from an M6 server; UNSPECIFIED or an
  // unknown value means "removed", reason unknown.
  MemberRemovedReason reason = 2;
}

// A non-member's redemption, or from minor 6 a member's claim code while the
// space has no owner (§ 6.2). Codes are secrets: never logged.
message Redeem {
  oneof code {
    string claim_code = 1;
    string invite_code = 2;
    // M7 (§ 6.14): join a space whose owner opened it.
    OpenJoin open_join = 3;
  }
}

// M7 (§ 6.14): no fields; its presence in Redeem.code is the request.
message OpenJoin {}

// Commands (§ 6.8), on the control stream with request_id != 0.
message Command {
  oneof kind {
    GetSpace get_space = 1;
    UpdateSpace update_space = 2;
    SetSpaceIcon set_space_icon = 3;
    FetchSpaceIcon fetch_space_icon = 4;
    CreateChannel create_channel = 5;
    UpdateChannel update_channel = 6;
    MoveChannel move_channel = 7;
    DeleteChannel delete_channel = 8;
    SetChannelPassword set_channel_password = 9;
    GetChannel get_channel = 10;
    CreateRole create_role = 11;
    UpdateRole update_role = 12;
    MoveRole move_role = 13;
    DeleteRole delete_role = 14;
    AddMemberRole add_member_role = 15;
    RemoveMemberRole remove_member_role = 16;
    SetOverwrite set_overwrite = 17;
    DeleteOverwrite delete_overwrite = 18;
    GetMember get_member = 19;
    UpdateProfile update_profile = 20;
    SetAvatar set_avatar = 21;
    SetNickname set_nickname = 22;
    CreateInvite create_invite = 23;
    ListInvites list_invites = 24;
    RevokeInvite revoke_invite = 25;
    TransferMember transfer_member = 26;
    TransferOwnership transfer_ownership = 27;
    // M3 (§ 6.9).
    SendMessage send_message = 28;
    EditMessage edit_message = 29;
    DeleteMessage delete_message = 30;
    AddReaction add_reaction = 31;
    RemoveReaction remove_reaction = 32;
    PinMessage pin_message = 33;
    UnpinMessage unpin_message = 34;
    CreateThread create_thread = 35;
    UpdateThread update_thread = 36;
    MarkRead mark_read = 37;
    // Named PokeMember: Poke is the ephemeral the target receives.
    PokeMember poke = 38;
    CreateEmoji create_emoji = 39;
    RenameEmoji rename_emoji = 40;
    DeleteEmoji delete_emoji = 41;
    // M4 (§ 6.10).
    JoinVoice join_voice = 42;
    LeaveVoice leave_voice = 43;
    SetVoiceState set_voice_state = 44;
    SetMemberVoice set_member_voice = 45;
    MoveMember move_member = 46;
    DisconnectMember disconnect_member = 47;
    SetWhisperList set_whisper_list = 48;
    ClearWhisperList clear_whisper_list = 49;
    // M5 (§ 6.11).
    ApplyTemplate apply_template = 50;
    // M6 (§ 6.12).
    KickMember kick_member = 51;
    BanMember ban_member = 52;
    UnbanMember unban_member = 53;
    TimeoutMember timeout_member = 54;
    // M7 (§ 6.6).
    PublishMedia publish_media = 55;
    UnpublishMedia unpublish_media = 56;
    SubscribeMedia subscribe_media = 57;
    AnswerMedia answer_media = 58;
    UnsubscribeMedia unsubscribe_media = 59;
    // M8 (§ 6.15).
    CreateBot create_bot = 60;
    RotateBot rotate_bot = 61;
    DeleteBot delete_bot = 62;
    RegisterCommands register_commands = 63;
    InvokeCommand invoke_command = 64;
    CreateWebhook create_webhook = 65;
    DeleteWebhook delete_webhook = 66;
    // M9 (§ 6.16).
    DeleteThread delete_thread = 67;
  }
}

message GetSpace {}

message UpdateSpace {
  optional string name = 1;
  optional string description = 2;
  optional string rules = 3;
  // M5 (§ 6.11).
  optional SpaceStyle style = 4;
  optional bool lobby_on_connect = 5;
  optional bool threads = 6;
  optional bool reactions = 7;
  optional bool member_list = 8;
  optional VoiceChatAccess voice_chat_access = 9;
  // 0 clears the default channel.
  optional uint64 default_voice_channel = 10;
  // M7 (§ 6.14).
  optional JoinPolicy join_policy = 11;
  // Present and empty: no roles. Absent: unchanged.
  optional RoleIdList open_join_role_ids = 12;
}

// M7 (§ 6.14): wraps a role list in a patch, so absent and empty differ.
message RoleIdList {
  repeated uint64 role_ids = 1;
}

message SetSpaceIcon {
  // Absent clears it.
  optional uint64 blob_id = 1;
}

message FetchSpaceIcon {}

message CreateChannel {
  ChannelKind kind = 1;
  optional uint64 parent_id = 2;
  optional uint32 position = 3;
  string name = 4;
  optional string topic = 5;
  optional uint32 slowmode_secs = 6;
  optional uint32 max_members = 7;
  optional bool age_restricted = 8;
  optional uint32 needed_talk_power = 9;
  optional uint32 max_bitrate = 10;
  // M3 (§ 6.9), text channels.
  optional uint32 retention_days = 11;
  optional bool no_history = 12;
  // M4 (§ 6.10): a temporary voice channel; needs CREATE_TEMP_CHANNEL.
  optional bool temporary = 13;
}

message UpdateChannel {
  uint64 channel_id = 1;
  optional string name = 2;
  optional string topic = 3;
  optional uint32 slowmode_secs = 4;
  optional uint32 max_members = 5;
  optional bool age_restricted = 6;
  optional uint32 needed_talk_power = 7;
  optional uint32 max_bitrate = 8;
  // M3 (§ 6.9), text channels.
  optional uint32 retention_days = 9;
  optional bool no_history = 10;
}

message MoveChannel {
  uint64 channel_id = 1;
  // Absent = top level.
  optional uint64 parent_id = 2;
  uint32 position = 3;
}

message DeleteChannel {
  uint64 channel_id = 1;
}

message SetChannelPassword {
  uint64 channel_id = 1;
  // A secret. Absent clears it.
  optional string password = 2;
}

message GetChannel {
  uint64 channel_id = 1;
}

message CreateRole {
  string name = 1;
  optional uint32 color = 2;
  optional bool hoist = 3;
  optional fixed64 permissions = 4;
  optional uint32 talk_power = 5;
}

message UpdateRole {
  uint64 role_id = 1;
  optional string name = 2;
  optional uint32 color = 3;
  optional bool hoist = 4;
  optional fixed64 permissions = 5;
  optional uint32 talk_power = 6;
}

message MoveRole {
  uint64 role_id = 1;
  uint32 position = 2;
}

message DeleteRole {
  uint64 role_id = 1;
}

message AddMemberRole {
  uint64 account_id = 1;
  uint64 role_id = 2;
}

message RemoveMemberRole {
  uint64 account_id = 1;
  uint64 role_id = 2;
}

message SetOverwrite {
  Overwrite overwrite = 1;
}

message DeleteOverwrite {
  uint64 channel_id = 1;
  oneof target {
    uint64 role_id = 2;
    uint64 account_id = 3;
  }
}

message GetMember {
  uint64 account_id = 1;
}

message UpdateProfile {
  optional string display_name = 1;
  optional string bio = 2;
  optional string pronouns = 3;
}

message SetAvatar {
  // Absent clears it.
  optional uint64 blob_id = 1;
}

message SetNickname {
  uint64 account_id = 1;
  // Absent clears it.
  optional string nickname = 2;
}

message CreateInvite {
  // Absent = never expires.
  optional uint32 expires_in_secs = 1;
  optional uint32 max_uses = 2;
  repeated uint64 role_ids = 3;
}

message ListInvites {}

message RevokeInvite {
  uint64 invite_id = 1;
}

message TransferMember {
  uint64 from_account_id = 1;
  uint64 to_account_id = 2;
}

message TransferOwnership {
  uint64 to_account_id = 1;
}

message CommandResult {
  oneof kind {
    Space space = 1;
    Channel channel = 2;
    uint64 created_id = 3;
    Member member = 4;
    InviteCreated invite_created = 5;
    InviteList invites = 6;
    BlobData blob = 7;
    // M7 (§ 6.6).
    MediaPublished media_published = 8;
    MediaOffer media_offer = 9;
    // M8 (§ 6.15).
    BotCreated bot_created = 10;
    WebhookCreated webhook_created = 11;
  }
}

message InviteCreated {
  Invite invite = 1;
  // A secret, returned once.
  string code = 2;
}

message InviteList {
  repeated Invite invites = 1;
}

// Requests (§ 6.8), on a QUIC request stream or multiplexed on TCP.
message Request {
  oneof kind {
    MemberPageRequest member_page = 1;
    FetchBlobRequest fetch_blob = 2;
    UploadImageRequest upload_image = 3;
    // M3 (§ 6.9).
    MessageHistoryRequest message_history = 4;
    GetMessagesRequest get_messages = 5;
    ListPinsRequest list_pins = 6;
    ListThreadsRequest list_threads = 7;
    SearchRequest search = 8;
    UploadAttachmentRequest upload_attachment = 9;
    FetchAttachmentRequest fetch_attachment = 10;
    AttachmentUrlRequest attachment_url = 11;
    UploadUrlRequest upload_url = 12;
    // M6 (§ 6.12).
    AuditPageRequest audit_page = 13;
    BanListRequest ban_list = 14;
    // M7 (§ 6.6).
    TurnCredentialsRequest turn_credentials = 15;
    // M8 (§ 6.15).
    BotListRequest bot_list = 16;
    CommandListRequest command_list = 17;
    WebhookListRequest webhook_list = 18;
  }
}

message MemberPageRequest {
  optional uint64 after_account_id = 1;
  // 1 to 1,000.
  uint32 limit = 2;
}

message FetchBlobRequest {
  uint64 blob_id = 1;
}

message UploadImageRequest {
  bytes data = 1;
  // M3 (§ 6.5, § 6.9). UNSPECIFIED means AVATAR.
  ImagePurpose purpose = 2;
}

enum ImagePurpose {
  IMAGE_PURPOSE_UNSPECIFIED = 0;
  // Re-encoded to at most 512 x 512 px: avatars and the space icon.
  IMAGE_PURPOSE_AVATAR = 1;
  // Re-encoded to at most 128 x 128 px: custom emoji.
  IMAGE_PURPOSE_EMOJI = 2;
}

message Response {
  oneof kind {
    MemberPage member_page = 1;
    BlobData blob = 2;
    Uploaded uploaded = 3;
    // M3 (§ 6.9).
    MessageList messages = 4;
    ThreadList threads = 5;
    SignedUrl url = 6;
    UploadSlot upload_slot = 7;
    // M6 (§ 6.12).
    AuditPage audit_page = 8;
    BanPage ban_page = 9;
    // M7 (§ 6.6).
    TurnCredentials turn_credentials = 10;
    // M8 (§ 6.15).
    BotList bot_list = 11;
    CommandList command_list = 12;
    WebhookList webhook_list = 13;
  }
}

message MemberPage {
  // Snapshot form, by ascending account_id, online and offline.
  repeated Member members = 1;
  bool has_more = 2;
  // The online ones' presence.
  repeated PresenceUpdate presences = 3;
}

message Uploaded {
  uint64 blob_id = 1;
}

// M3 (minor 3): text chat (§ 6.9). Ids uint64, times unix seconds; message ids
// increase in commit order. User text here is data, never markup, and never
// logged (§ 7.6).

// Objects.

message Message {
  uint64 id = 1;
  uint64 channel_id = 2;
  // Set on a thread's messages: the thread's (root message's) id.
  optional uint64 thread_id = 3;
  // 0 = a deleted member (§ 7.3).
  uint64 author_id = 4;
  uint64 created_at = 5;
  // Empty on a tombstone.
  string content = 6;
  optional uint64 reply_to = 7;
  // Parsed by the server from content; never sent by clients.
  Mentions mentions = 8;
  repeated Attachment attachments = 9;
  repeated ReactionCount reactions = 10;
  optional uint64 edited_at = 11;
  // A tombstone: no content, mentions, attachments or reactions.
  bool deleted = 12;
  bool pinned = 13;
  // M8 (§ 6.15): set on a webhook's message, whose author_id is 0.
  optional uint64 webhook_id = 14;
  // The webhook's name when it posted: user text.
  optional string webhook_name = 15;
}

message Mentions {
  repeated uint64 account_ids = 1;
  repeated uint64 role_ids = 2;
  repeated uint64 channel_ids = 3;
  bool everyone = 4;
  bool here = 5;
}

// No file name, ever (§ 6.5).
message Attachment {
  uint64 id = 1;
  // Sniffed by the server from the file's first bytes.
  string media_type = 2;
  uint64 size = 3;
  // 0 when not an image.
  uint32 width = 4;
  uint32 height = 5;
  bool has_thumbnail = 6;
}

message EmojiRef {
  oneof emoji {
    string unicode = 1;
    uint64 custom_id = 2;
  }
}

message ReactionCount {
  EmojiRef emoji = 1;
  uint32 count = 2;
  // Whether the requester reacted: set in Responses only, false in events.
  bool me = 3;
}

// Thread.id is its root message's id.
message Thread {
  uint64 id = 1;
  uint64 channel_id = 2;
  string name = 3;
  bool archived = 4;
  uint64 created_by = 5;
  uint64 created_at = 6;
}

message CustomEmoji {
  uint64 id = 1;
  string name = 2;
  // An attachment id, fetched with fetch_blob.
  uint64 image_id = 3;
  uint64 created_by = 4;
}

// Covers a channel together with its threads.
message ReadState {
  uint64 channel_id = 1;
  // 0 = nothing read.
  uint64 last_read_id = 2;
  uint32 mention_count = 3;
  // 0 = no message.
  uint64 last_message_id = 4;
}

// Commands.

message SendMessage {
  uint64 channel_id = 1;
  optional uint64 thread_id = 2;
  string content = 3;
  optional uint64 reply_to = 4;
  // The sender's own pending attachments, at most 10.
  repeated uint64 attachment_ids = 5;
}

message EditMessage {
  uint64 message_id = 1;
  string content = 2;
}

message DeleteMessage {
  uint64 message_id = 1;
}

message AddReaction {
  uint64 message_id = 1;
  EmojiRef emoji = 2;
}

message RemoveReaction {
  uint64 message_id = 1;
  EmojiRef emoji = 2;
  // Absent = the actor's own; another's needs MANAGE_MESSAGES.
  optional uint64 account_id = 3;
}

message PinMessage {
  uint64 message_id = 1;
}

message UnpinMessage {
  uint64 message_id = 1;
}

message CreateThread {
  uint64 message_id = 1;
  string name = 2;
}

message UpdateThread {
  uint64 thread_id = 1;
  optional string name = 2;
  optional bool archived = 3;
}

message MarkRead {
  uint64 channel_id = 1;
  // A message of the channel or its threads; 0 = nothing read.
  uint64 message_id = 2;
}

message PokeMember {
  uint64 account_id = 1;
  optional string text = 2;
}

message CreateEmoji {
  string name = 1;
  // The actor's pending upload_image with purpose EMOJI.
  uint64 image_id = 2;
}

message RenameEmoji {
  uint64 emoji_id = 1;
  string name = 2;
}

message DeleteEmoji {
  uint64 emoji_id = 1;
}

// Voice (§ 6.10). The datagrams themselves are not protobuf (§ 6.4, the
// voice module).

// An account's place in voice. channel_id 0 = not in voice (session_ref is
// then 0 too).
message VoiceState {
  uint64 account_id = 1;
  uint64 channel_id = 2;
  // Minted on every join and move; never reused while the server runs.
  uint32 session_ref = 3;
  bool self_mute = 4;
  bool self_deaf = 5;
  bool server_mute = 6;
  bool server_deaf = 7;
  bool priority = 8;
  // M8 (§ 6.15): the session takes in the channel's audio for more than
  // listening. Set by the server for bots; declared by other sessions.
  bool receiving_audio = 9;
}

// The account's whole state after a change, and the voice channel it was in
// before (0 = none; 0 too in a copy for a session that cannot see it).
message VoiceStateUpdated {
  VoiceState state = 1;
  uint64 previous_channel_id = 2;
}

// A session's own voice membership: the session_ref its datagrams carry and
// the channel, or 0 and 0 once it is out of voice.
message VoiceSession {
  uint32 session_ref = 1;
  uint64 channel_id = 2;
}

message JoinVoice {
  uint64 channel_id = 1;
  // A secret: 1-64 bytes, never logged.
  optional string password = 2;
}

message LeaveVoice {}

message SetVoiceState {
  optional bool self_mute = 1;
  optional bool self_deaf = 2;
  optional bool priority = 3;
  // M8 (§ 6.15): ignored for bots, whose value the server sets.
  optional bool receiving_audio = 4;
}

message SetMemberVoice {
  uint64 account_id = 1;
  optional bool server_mute = 2;
  optional bool server_deaf = 3;
}

message MoveMember {
  uint64 account_id = 1;
  uint64 channel_id = 2;
}

message DisconnectMember {
  uint64 account_id = 1;
}

// list_id 1-8; at most 50 accounts, 10 channels and 10 roles (not @everyone).
message SetWhisperList {
  uint32 list_id = 1;
  repeated uint64 account_ids = 2;
  repeated uint64 channel_ids = 3;
  repeated uint64 role_ids = 4;
}

message ClearWhisperList {
  uint32 list_id = 1;
}

// M5 (§ 6.11): adds a template's channels, roles and overwrites; removes nothing.
message ApplyTemplate {
  StarterTemplate template = 1;
}

// Requests.

message MessageHistoryRequest {
  uint64 channel_id = 1;
  optional uint64 thread_id = 2;
  // Absent = the newest messages.
  oneof anchor {
    uint64 before = 3;
    uint64 after = 4;
    uint64 around = 5;
  }
  // 1 to 100.
  uint32 limit = 6;
}

message GetMessagesRequest {
  // 1 to 100.
  repeated uint64 message_ids = 1;
}

message ListPinsRequest {
  uint64 channel_id = 1;
}

message ListThreadsRequest {
  uint64 channel_id = 1;
  bool archived = 2;
  optional uint64 before_id = 3;
  // 1 to 100.
  uint32 limit = 4;
}

message SearchRequest {
  string query = 1;
  optional uint64 before_id = 2;
  // 1 to 25.
  uint32 limit = 3;
}

message UploadAttachmentRequest {
  bytes data = 1;
}

message FetchAttachmentRequest {
  uint64 attachment_id = 1;
  bool thumbnail = 2;
}

message AttachmentUrlRequest {
  uint64 attachment_id = 1;
  bool thumbnail = 2;
}

message UploadUrlRequest {
  uint64 size = 1;
}

// Responses.

message MessageList {
  repeated Message messages = 1;
  bool has_more = 2;
}

message ThreadList {
  repeated Thread threads = 1;
  bool has_more = 2;
}

// A secret until it expires: never logged.
message SignedUrl {
  string url = 1;
  uint64 expires_at = 2;
}

message UploadSlot {
  uint64 attachment_id = 1;
  // A secret until it expires: never logged.
  string url = 2;
  uint64 expires_at = 3;
}

// Typing.

message StartTyping {
  uint64 channel_id = 1;
  optional uint64 thread_id = 2;
}

// Events.

message MessageCreated {
  Message message = 1;
}

// An edit; the message's full form.
message MessageUpdated {
  Message message = 1;
}

message MessageDeleted {
  uint64 channel_id = 1;
  uint64 message_id = 2;
}

message ReactionAdded {
  uint64 channel_id = 1;
  uint64 message_id = 2;
  EmojiRef emoji = 3;
  uint64 account_id = 4;
}

message ReactionRemoved {
  uint64 channel_id = 1;
  uint64 message_id = 2;
  EmojiRef emoji = 3;
  uint64 account_id = 4;
}

message MessagePinned {
  uint64 channel_id = 1;
  uint64 message_id = 2;
  uint64 pinned_by = 3;
}

message MessageUnpinned {
  uint64 channel_id = 1;
  uint64 message_id = 2;
}

message ThreadCreated {
  Thread thread = 1;
}

message ThreadUpdated {
  Thread thread = 1;
}

message EmojiCreated {
  CustomEmoji emoji = 1;
}

message EmojiUpdated {
  CustomEmoji emoji = 1;
}

message EmojiDeleted {
  uint64 emoji_id = 1;
}

// Ephemerals.

message Typing {
  uint64 channel_id = 1;
  optional uint64 thread_id = 2;
  uint64 account_id = 3;
}

message Poke {
  uint64 from_account_id = 1;
  string text = 2;
}

// M6 (minor 6): moderation (§ 6.12). No free text: audit entries, bans and
// these commands hold ids, enums, numbers and times only (§ 7.1, § 7.6).

// Objects.

// Why a member was removed (`MemberRemoved.reason`).
enum MemberRemovedReason {
  MEMBER_REMOVED_REASON_UNSPECIFIED = 0;
  // A member transfer (§ 6.8).
  MEMBER_REMOVED_REASON_TRANSFERRED = 1;
  // A kick, or an erasure (§ 6.13).
  MEMBER_REMOVED_REASON_KICKED = 2;
  MEMBER_REMOVED_REASON_BANNED = 3;
}

// Who did an audited action.
enum ActorKind {
  ACTOR_KIND_UNSPECIFIED = 0;
  ACTOR_KIND_MEMBER = 1;
  // The operator CLI or the HTTP API (§ 6.13): no account.
  ACTOR_KIND_OPERATOR = 2;
}

// What an audit entry records; § 6.12 lists the fields each one fills.
enum AuditAction {
  AUDIT_ACTION_UNSPECIFIED = 0;
  AUDIT_ACTION_TRANSFER_MEMBER = 1;
  AUDIT_ACTION_TRANSFER_OWNERSHIP = 2;
  AUDIT_ACTION_KICK = 3;
  AUDIT_ACTION_BAN = 4;
  AUDIT_ACTION_UNBAN = 5;
  AUDIT_ACTION_TIMEOUT_SET = 6;
  AUDIT_ACTION_TIMEOUT_CLEAR = 7;
  AUDIT_ACTION_EXPORT = 8;
  AUDIT_ACTION_ERASE = 9;
  AUDIT_ACTION_BACKUP = 10;
  AUDIT_ACTION_RESTORE = 11;
  AUDIT_ACTION_ADMIN_TOKEN_CREATE = 12;
  AUDIT_ACTION_ADMIN_TOKEN_REVOKE = 13;
  AUDIT_ACTION_RESET_OWNER = 14;
  // M7 (§ 6.14).
  AUDIT_ACTION_JOIN_POLICY_CHANGED = 15;
  AUDIT_ACTION_OPEN_JOIN_ROLES_CHANGED = 16;
  // M8 (§ 6.15).
  AUDIT_ACTION_BOT_CREATE = 17;
  AUDIT_ACTION_BOT_ROTATE = 18;
  AUDIT_ACTION_BOT_DELETE = 19;
  AUDIT_ACTION_WEBHOOK_CREATE = 20;
  AUDIT_ACTION_WEBHOOK_DELETE = 21;
  // M9 (§ 6.16): management actions.
  AUDIT_ACTION_ROLE_CREATE = 22;
  AUDIT_ACTION_ROLE_UPDATE = 23;
  AUDIT_ACTION_ROLE_MOVE = 24;
  AUDIT_ACTION_ROLE_DELETE = 25;
  AUDIT_ACTION_MEMBER_ROLE_ADD = 26;
  AUDIT_ACTION_MEMBER_ROLE_REMOVE = 27;
  AUDIT_ACTION_OVERWRITE_SET = 28;
  AUDIT_ACTION_OVERWRITE_DELETE = 29;
  AUDIT_ACTION_CHANNEL_CREATE = 30;
  AUDIT_ACTION_CHANNEL_UPDATE = 31;
  AUDIT_ACTION_CHANNEL_MOVE = 32;
  AUDIT_ACTION_CHANNEL_DELETE = 33;
  AUDIT_ACTION_INVITE_CREATE = 34;
  AUDIT_ACTION_INVITE_REVOKE = 35;
  AUDIT_ACTION_THREAD_DELETE = 36;
  AUDIT_ACTION_TEMPLATE_APPLY = 37;
}

message AuditEntry {
  uint64 id = 1;
  // Unix seconds.
  uint64 at = 2;
  ActorKind actor_kind = 3;
  // Set exactly when actor_kind is MEMBER.
  optional uint64 actor_account_id = 4;
  AuditAction action = 5;
  optional uint64 target_account_id = 6;
  optional uint64 other_account_id = 7;
  optional uint64 value = 8;
}

// A ban is by identity only.
message Ban {
  uint64 account_id = 1;
  // Unix seconds.
  uint64 created_at = 2;
}

// Commands.

message KickMember {
  uint64 account_id = 1;
}

message BanMember {
  uint64 account_id = 1;
}

message UnbanMember {
  uint64 account_id = 1;
}

message TimeoutMember {
  uint64 account_id = 1;
  // Unix seconds, at most 28 days ahead; absent clears the timeout.
  optional uint64 until = 2;
}

// Requests.

message AuditPageRequest {
  // Entries with an id below this; absent = from the newest.
  optional uint64 before = 1;
  // 1 to 100.
  uint32 limit = 2;
  // Only this action; UNSPECIFIED or an unknown value is INVALID.
  optional AuditAction action = 3;
}

message BanListRequest {
  // Bans with an account_id below this; absent = from the highest.
  optional uint64 before = 1;
  // 1 to 100.
  uint32 limit = 2;
}

// Responses.

message AuditPage {
  // Newest first.
  repeated AuditEntry entries = 1;
  bool has_more = 2;
}

message BanPage {
  // By descending account_id.
  repeated Ban bans = 1;
  bool has_more = 2;
}

// M7 (§ 6.6): screen share and camera through the server's SFU.

enum MediaKind {
  MEDIA_KIND_UNSPECIFIED = 0;
  // A screen: video, plus its audio when the publisher shares it.
  MEDIA_KIND_SCREEN = 1;
  // A camera: video only.
  MEDIA_KIND_CAMERA = 2;
}

// One published stream. Ids come from one server-wide counter, from 1, never
// reused while the process runs; never stored.
message MediaTrack {
  uint64 media_id = 1;
  uint64 account_id = 2;
  uint64 channel_id = 3;
  MediaKind kind = 4;
}

message TurnCredentials {
  repeated string urls = 1;
  // Secrets: Debug shows their length only.
  string username = 2;
  string password = 3;
  // Unix seconds.
  uint64 expires_at = 4;
}

enum MediaEndReason {
  MEDIA_END_REASON_UNSPECIFIED = 0;
  MEDIA_END_REASON_LEFT = 1;
  MEDIA_END_REASON_PERMISSION = 2;
  MEDIA_END_REASON_MODERATION = 3;
  MEDIA_END_REASON_FAILED = 4;
  MEDIA_END_REASON_TRACK_ENDED = 5;
}

// SDP carries addresses and ICE credentials: Debug shows its length only.
message PublishMedia {
  MediaKind kind = 1;
  // At most 16,384 bytes.
  string sdp_offer = 2;
}

message UnpublishMedia {
  uint64 media_id = 1;
}

message SubscribeMedia {
  uint64 media_id = 1;
}

message AnswerMedia {
  uint64 subscription_id = 1;
  // At most 16,384 bytes.
  string sdp_answer = 2;
}

message UnsubscribeMedia {
  uint64 subscription_id = 1;
}

message MediaPublished {
  uint64 media_id = 1;
  string sdp_answer = 2;
}

message MediaOffer {
  uint64 subscription_id = 1;
  uint64 media_id = 2;
  string sdp_offer = 3;
}

message TurnCredentialsRequest {}

message MediaTrackAdded {
  MediaTrack track = 1;
}

message MediaTrackRemoved {
  uint64 media_id = 1;
}

// A MediaEnded without a target is ignored by clients.
message MediaEnded {
  oneof target {
    uint64 media_id = 1;
    uint64 subscription_id = 2;
  }
  MediaEndReason reason = 3;
}

// --- M8: bots (§ 6.15) ---

// A bot of the space, as `bot_list` and `create_bot` show it: never its seed
// or key.
message Bot {
  uint64 account_id = 1;
  // The bot's current display name: user text.
  string name = 2;
  // Unix seconds.
  uint64 created_at = 3;
  // The member who created it.
  uint64 created_by = 4;
}

// `create_bot` and `rotate_bot`: the bot and its seed, a secret returned once.
message BotCreated {
  Bot bot = 1;
  // 52 lowercase base32 characters (32 bytes, no padding).
  string seed = 2;
}

message BotList {
  // Newest first (`created_at`, then `account_id`, descending).
  repeated Bot bots = 1;
}

message CreateBot {
  // The display-name rules (§ 6.8).
  string name = 1;
}

message RotateBot {
  uint64 account_id = 1;
}

message DeleteBot {
  uint64 account_id = 1;
}

message BotListRequest {}

// --- M8: slash commands and webhooks (§ 6.15) ---

enum CommandOptionKind {
  COMMAND_OPTION_KIND_UNSPECIFIED = 0;
  COMMAND_OPTION_KIND_STRING = 1;
  COMMAND_OPTION_KIND_INTEGER = 2;
  COMMAND_OPTION_KIND_BOOLEAN = 3;
  COMMAND_OPTION_KIND_MEMBER = 4;
  COMMAND_OPTION_KIND_CHANNEL = 5;
}

message CommandOption {
  // 1-32 bytes of a-z, 0-9, _ and -; unique within the command.
  string name = 1;
  // 1-100 bytes, the display-name rules: user text.
  string description = 2;
  CommandOptionKind kind = 3;
  // Required options come before optional ones.
  bool required = 4;
}

message SlashCommand {
  // 1-32 bytes of a-z, 0-9, _ and -; unique within the set.
  string name = 1;
  // 1-100 bytes, the display-name rules: user text.
  string description = 2;
  // At most 10.
  repeated CommandOption options = 3;
}

// `command_list`: one bot's set, in registration order.
message CommandList {
  uint64 bot_account_id = 1;
  repeated SlashCommand commands = 2;
}

// One option of an invocation: user text, never stored or logged.
message CommandOptionValue {
  string name = 1;
  oneof value {
    // STRING: 1-1,000 bytes.
    string text = 2;
    sint64 integer = 3;
    bool boolean = 4;
    // MEMBER.
    uint64 account_id = 5;
    // CHANNEL.
    uint64 channel_id = 6;
  }
}

// To the bot's session: a member invoked one of its commands.
message Interaction {
  uint64 invoker_id = 1;
  uint64 channel_id = 2;
  string name = 3;
  repeated CommandOptionValue options = 4;
}

// Payload-free apart from the bot: clients fetch its set with command_list.
message CommandsUpdated {
  uint64 bot_account_id = 1;
}

// An incoming webhook, as listed: never its token.
message Webhook {
  uint64 id = 1;
  // A text channel.
  uint64 channel_id = 2;
  // The display-name rules: user text.
  string name = 3;
  uint64 created_by = 4;
  // Unix seconds.
  uint64 created_at = 5;
}

// `create_webhook`: the webhook and its token, a secret returned once.
message WebhookCreated {
  Webhook webhook = 1;
  // `<id>.<secret>`: 16 hex characters, a dot, 26 base32 characters.
  string token = 2;
}

message WebhookList {
  // By id ascending.
  repeated Webhook webhooks = 1;
}

// A bot session's whole set of commands; an empty list removes them all.
message RegisterCommands {
  // At most 50.
  repeated SlashCommand commands = 1;
}

message InvokeCommand {
  uint64 bot_account_id = 1;
  uint64 channel_id = 2;
  string name = 3;
  repeated CommandOptionValue options = 4;
}

message CreateWebhook {
  // A text channel.
  uint64 channel_id = 1;
  // The display-name rules (§ 6.8).
  string name = 2;
}

message DeleteWebhook {
  uint64 webhook_id = 1;
}

message CommandListRequest {
  uint64 bot_account_id = 1;
}

message WebhookListRequest {}

// M9 (§ 6.16): minor 9.
message DeleteThread {
  uint64 thread_id = 1;
}

message ThreadDeleted {
  uint64 channel_id = 1;
  uint64 thread_id = 2;
}
