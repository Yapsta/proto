# Time-boxed cargo-fuzz runs of yapsta-proto's targets (fuzz):
# the frame codec, Envelope decoding, the identity parsers and the voice
# header. Weekly and on demand only, never on pull requests, so PR CI is not
# slowed. A crash fails the job and uploads its input as an artifact; rerun it
# locally with `scripts/fuzz.sh <target> <artifact>`.
name: Fuzz

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        required: false
        default: "300"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # cargo-fuzz needs nightly (-Zsanitizer). Pinned, bumped by hand.
  NIGHTLY: nightly-2026-11-01
  CARGO_FUZZ: 0.13.2

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [frame_decode, envelope_decode, identity, voice_header]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain and cargo-fuzz
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal
          cargo +"$NIGHTLY" install cargo-fuzz --version "$CARGO_FUZZ" --locked
      - name: Run ${{ matrix.target }}
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '300' }}
          TARGET: ${{ matrix.target }}
        run: scripts/fuzz.sh "$TARGET" -max_total_time="$SECONDS_PER_TARGET"
      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/
          retention-days: 14
