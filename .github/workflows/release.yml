# Cuts a release from GitHub Actions, the only release path: Actions →
# Release → Run workflow → version. Nothing is built or published but the tag
# and the GitHub Release: consumers depend on the tag as a Cargo git
# dependency (README.md).
#
# The check job, on a fresh full checkout of `ref` (main by default): the
# commit is on main, `version` is its Cargo.toml version, CHANGELOG.md has its
# entry and v<version> is not tagged yet (scripts/release.sh check). It
# renders the release notes into the run's summary: the CHANGELOG.md entry and
# GitHub's list of the pull requests merged since the previous release. With
# dry_run it stops there.
#
# The release job (the `release` environment, so it can require an approval)
# creates the annotated tag v<version> on that commit through the GitHub API,
# as github-actions[bot], then the GitHub Release with those notes.
#
# Runs only when dispatched from main, and only on demand.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 1.10.0): Cargo.toml's at that commit"
        required: true
        type: string
      ref:
        description: "Commit, branch or tag to release; it must be on main"
        required: false
        default: main
        type: string
      dry_run:
        description: "Check and render the notes only: no tag, no release"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check and render the notes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # contents: write only for GitHub's generate-notes API (the preview of
    # the pull request list); this job creates nothing.
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.cut.outputs.sha }}
      previous: ${{ steps.cut.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Check the commit is on main
        env:
          REF: ${{ inputs.ref }}
        run: |
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "::error::${REF} ($(git rev-parse --short HEAD)) is not on main"; exit 1; }
      - name: Check the version
        id: cut
        env:
          VERSION: ${{ inputs.version }}
        run: |
          previous=$(scripts/release.sh check "${VERSION}")
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "previous=${previous}" >> "${GITHUB_OUTPUT}"
      - name: Release notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p "${RUNNER_TEMP}/notes"
          scripts/release.sh notes "${VERSION}" > "${RUNNER_TEMP}/notes/notes.md"
      - name: Render the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ steps.cut.outputs.sha }}
          PREVIOUS: ${{ steps.cut.outputs.previous }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          start=()
          [ -z "${PREVIOUS}" ] || start=(-f previous_tag_name="${PREVIOUS}")
          generated=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="v${VERSION}" -f target_commitish="${SHA}" ${start[@]+"${start[@]}"} --jq .body)
          {
            if [ "${DRY_RUN}" = true ]; then
              echo "> **Dry run:** v${VERSION} would tag ${SHA} (previous release: ${PREVIOUS:-none}). Nothing was tagged or published."
            else
              echo "> v${VERSION} tags ${SHA} (previous release: ${PREVIOUS:-none}) once the release job runs."
            fi
            echo
            echo "# Release notes for v${VERSION}"
            cat "${RUNNER_TEMP}/notes/notes.md"
            echo
            printf '%s\n' "${generated}"
          } | tee -a "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Tag and publish the GitHub Release
    needs: check
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      # An annotated tag object, then its ref; creating the ref fails if the
      # tag appeared since the check.
      - name: Tag the commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          object=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags" -f tag="v${VERSION}" \
            -f message="yapsta-proto ${VERSION}" -f object="${SHA}" -f type=commit --jq .sha)
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/v${VERSION}" -f sha="${object}" > /dev/null
          echo "Tagged v${VERSION} at ${SHA}" >> "${GITHUB_STEP_SUMMARY}"
      # The notes file first, then GitHub's list of the pull requests merged
      # since the previous release (--generate-notes appends it).
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PREVIOUS: ${{ needs.check.outputs.previous }}
        run: |
          start=()
          [ -z "${PREVIOUS}" ] || start=(--notes-start-tag "${PREVIOUS}")
          gh release create "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --verify-tag --title "v${VERSION}" \
            --notes-file notes/notes.md --generate-notes ${start[@]+"${start[@]}"}
          echo "Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}" >> "${GITHUB_STEP_SUMMARY}"
