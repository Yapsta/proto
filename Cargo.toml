[package]
name = "yapsta-proto"
description = "Yapsta's native wire protocol: messages, error codes and the frame codec (docs/PROTOCOL.md)."
# MAJOR.MINOR follows the protocol (ALPN yapsta/MAJOR, newest minor
# MINOR_VERSION); PATCH counts every other release (README.md, Versioning).
version = "1.11.2"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/Yapsta/proto"
# Consumers depend on a release tag of this repository; nothing goes to crates.io.
publish = false

# Caret requirements only: each entry is a floor that never crosses a major.
[dependencies]
# Identity (§ 6.2): bip39 without `rand` (rand 0.8 / advisories).
bip39 = { version = "3.0.0", default-features = false, features = ["std", "zeroize", "unicode-normalization"] }
bytes = "1.12.1"
data-encoding = "2.11.1"
# Identity (§ 6.2): verify_strict only.
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["zeroize"] }
getrandom = "0.4.3"
# HKDF is done on hmac directly: hkdf keeps its PRK in a value it never zeroizes.
hmac = { version = "0.13.0", features = ["zeroize"] }
prost = { version = "0.14.4", default-features = false, features = ["std", "derive"] }
sha2 = { version = "0.11.1", features = ["zeroize"] }
thiserror = "2.0.21"
tokio-util = { version = "0.7.20", default-features = false, features = ["codec"] }
zeroize = "1.9.1"

# The .proto files compile with protox: no system protoc, for every consumer.
[build-dependencies]
prost = { version = "0.14.4", default-features = false, features = ["std", "derive"] }
prost-build = "0.14.4"
# The descriptor types build.rs reads to write the decoded-size table.
prost-types = "0.14.4"
protox = "0.10.0"

[dev-dependencies]
# Forging small-order signatures that verify_strict must refuse.
curve25519-dalek = { version = "5.0.0", default-features = false }
# The tests check the hand-written HKDF against the hkdf crate.
hkdf = "0.13.0"
prost-types = "0.14.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "deny"
dbg_macro = "deny"
large_futures = "warn"
